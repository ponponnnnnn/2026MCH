<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>語音測試</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:24px 16px;background:#faf7f2;color:#222}
  button{font-size:28px;padding:28px;width:100%;border:0;border-radius:20px;background:#2f7d4f;color:#fff}
  button.on{background:#c0392b}
  #status{margin:16px 0;color:#666}
  #log{background:#fff;border-radius:12px;padding:12px;min-height:200px;line-height:1.6}
  .elder{color:#1a5fb4}.agent{color:#2f7d4f}
</style>
</head>
<body>
<h2>跟小幫手聊聊</h2>
<div id="status">尚未連線</div>
<button id="btn">開始通話</button>
<div id="log"></div>
<script>
const $ = (id) => document.getElementById(id);
let ws, ctx, mic, node, playHead = 0, sources = [], active = false;

// Demo 用：從網址帶 elderId，例如 ?elderId=demo-plumber 或 ?elderId=demo-teacher
// DEV_NO_DB=1 模式下，這兩個 id 會對到 src/data/profile.ts 裡的 DEMO_PROFILES 假資料
const elderId = new URLSearchParams(location.search).get('elderId') || '';
if (elderId) {
  $('status').textContent = `尚未連線（長輩：${elderId}）`;
}

const workletSrc = `
class Cap extends AudioWorkletProcessor {
  constructor(){ super(); this.buf=[]; this.ratio=sampleRate/16000; this.pos=0; }
  process(inputs){
    const ch = inputs[0][0]; if(!ch) return true;
    const out=[];
    while(this.pos < ch.length){ out.push(ch[Math.floor(this.pos)]); this.pos += this.ratio; }
    this.pos -= ch.length;
    this.buf.push(...out);
    if(this.buf.length >= 1600){           // 約 100ms
      const pcm = new Int16Array(this.buf.length);
      for(let i=0;i<pcm.length;i++){ const s=Math.max(-1,Math.min(1,this.buf[i])); pcm[i]=s<0?s*0x8000:s*0x7fff; }
      this.port.postMessage(pcm.buffer, [pcm.buffer]); this.buf=[];
    }
    return true;
  }
}
registerProcessor('cap', Cap);`;

function line(role, text){
  const box = $('log'); let last = box.lastElementChild;
  if(!last || last.dataset.role !== role){
    last = document.createElement('div'); last.dataset.role = role; last.className = role;
    last.textContent = (role==='elder'?'👵 ':'🤖 '); box.appendChild(last);
  }
  last.textContent += text;
}

function playPcm24k(buf){
  const i16 = new Int16Array(buf), f32 = new Float32Array(i16.length);
  for(let i=0;i<i16.length;i++) f32[i] = i16[i]/32768;
  const ab = ctx.createBuffer(1, f32.length, 24000); ab.copyToChannel(f32, 0);
  const src = ctx.createBufferSource(); src.buffer = ab; src.connect(ctx.destination);
  playHead = Math.max(playHead, ctx.currentTime); src.start(playHead); playHead += ab.duration;
  sources.push(src); src.onended = () => sources = sources.filter(s => s !== src);
}
function stopPlayback(){ sources.forEach(s => { try{s.stop()}catch{} }); sources=[]; playHead=0; }

async function start(){
  ctx = new AudioContext();
  mic = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, channelCount:1 } });
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([workletSrc],{type:'application/javascript'})));
  node = new AudioWorkletNode(ctx, 'cap');
  ctx.createMediaStreamSource(mic).connect(node);

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const wsPath = elderId ? `/ws?elderId=${encodeURIComponent(elderId)}` : '/ws';
  ws = new WebSocket(`${proto}://${location.host}${wsPath}`); ws.binaryType = 'arraybuffer';
  ws.onmessage = (e) => {
    if(e.data instanceof ArrayBuffer){ playPcm24k(e.data); return; }
    const m = JSON.parse(e.data);
    if(m.type==='ready'){ $('status').textContent = elderId ? `通話中（長輩：${elderId}），請直接說話` : '通話中，請直接說話'; }
    else if(m.type==='transcript'){ line(m.role, m.text); }
    else if(m.type==='interrupted'){ stopPlayback(); }
    else if(m.type==='error'){ $('status').textContent='錯誤：'+m.message; }
  };
  ws.onclose = () => stop(false);
  node.port.onmessage = (e) => { if(ws.readyState===1) ws.send(e.data); };
  active = true; $('btn').textContent='結束通話'; $('btn').className='on'; $('status').textContent='連線中…';
}
function stop(notify=true){
  if(!active) return; active = false;
  if(notify && ws?.readyState===1) ws.send(JSON.stringify({type:'end'}));
  ws?.close(); mic?.getTracks().forEach(t=>t.stop()); stopPlayback(); ctx?.close();
  $('btn').textContent='開始通話'; $('btn').className=''; $('status').textContent='已結束';
}
$('btn').onclick = () => active ? stop() : start().catch(err => { $('status').textContent='無法啟動：'+err.message; });
</script>
</body>
</html>
